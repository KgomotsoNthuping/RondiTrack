services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: ronditrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ronditrack"]
      interval: 5s
      timeout: 3s
      retries: 10

    volumes:
      - postgres-data:/var/lib/postgresql/data


  api:
    build:
      context: .
      dockerfile: Containerfile

    ports:
      - "8080-8081:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__RondiTrack: "Host=postgres;Port=5432;Database=ronditrack;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}

      Seed__DemoPassword: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}

      Cors__AllowedOrigins__0: http://localhost:3000

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres-data: